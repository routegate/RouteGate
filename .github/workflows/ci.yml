name: RouteGate CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: routegate_ci
          POSTGRES_USER: routegate
          POSTGRES_PASSWORD: routegate_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U routegate -d routegate_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ROUTEGATE_TEST_DATABASE_URL: postgres://routegate:routegate_ci_password@127.0.0.1:5432/routegate_ci?sslmode=disable

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Verify unprivileged Manager startup with interrupted credential conversion
        run: |
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/rg-manager-startup" ./cmd/routegate-manager
          sudo bash ../scripts/test-manager-startup-latch.sh "$RUNNER_TEMP/rg-manager-startup"

      - name: Verify external schema readiness with a non-owner login
        run: go test ./internal/db -run '^TestSchemaReadiness' -count=1 -timeout=120s -v

      - name: Verify old credential membership preflight and session fence
        run: go test ./internal/db -run '^TestCredentialConversion(SessionFence|Membership)' -count=1 -timeout=90s -v

      - name: Verify explicit runtime role privileges and unchanged SQL fences
        run: go test ./internal/db -run '^TestRuntimeRole' -count=1 -timeout=120s -v

      - name: Verify migration and role provisioning commands exit without serving HTTP
        run: |
          timeout 60s go run ./cmd/routegate-manager --migrate-only
          timeout 60s go run ./cmd/routegate-manager --create-runtime-role rg140_ci_runtime
        env:
          ROUTEGATE_DATABASE_URL: postgres://routegate:routegate_ci_password@127.0.0.1:5432/routegate_ci?sslmode=disable

      - name: Verify Manager credential-removal Agent-only typed wire
        run: go test ./internal/agents -run '^TestAgentCredentialRemovalRequestWireParity$' -count=1 -timeout=120s -v

      - name: Verify approved IDs still cannot bypass generic Apply SQL guards
        run: go test ./internal/db -run '^TestCredentialRemovalApprovedIDsStillBlockGenericApply$' -count=1 -timeout=120s -v

      # Split both original suites into independent Go processes.
      # Retain their 120-second timeout and every previous test.
      - name: Verify credential revocation preparation transactions
        run: go test ./internal/db -run '^TestCredentialRevocation' -count=1 -timeout=120s -v

      - name: Verify runtime mutation fencing and recovery conflicts
        run: go test ./internal/db -run '^TestRuntimeMutationFencing' -count=1 -timeout=120s -v

      - name: Verify read-only prepared credential-removal integrity
        run: go test ./internal/db -run '^TestPreparedCredentialRemovalIntegrity$' -count=1 -timeout=120s -v

      - name: Verify immutable proposed credential-removal job IDs
        run: go test ./internal/db -run '^TestCredentialRemovalJobIDBinding' -count=1 -timeout=120s -v

      - name: Verify explicit human credential-removal dispatch approval
        run: go test ./internal/db -run '^TestCredentialRemovalDispatchHumanApproval$' -count=1 -timeout=120s -v

      - name: Verify locked dispatch-admission gate and authority invalidation
        run: go test ./internal/db -run '^TestCredentialRemovalDispatchAdmission' -count=1 -timeout=120s -v

      - name: Verify immutable non-executable credential-removal staging
        run: go test ./internal/db -run '^TestCredentialRemovalDispatchStage' -count=1 -timeout=120s -v


      - name: Verify exact prepared-removal JSON semantics
        run: go test ./internal/revocations -run '^TestPreparedRemovalJSONExactNumericSemantics$' -count=1 -timeout=120s -v

      - name: Verify recovery commit proof transactions and historical readback
        run: go test ./internal/db -run '^TestRecoveryCommit' -count=1 -timeout=120s -v

      - name: Verify fresh conditional recovery release authorization
        run: go test ./internal/db -run '^TestRecoveryRelease' -count=1 -timeout=120s -v

      - name: Verify final consumption evidence and historical readback
        run: go test ./internal/db -run '^TestRecoveryFinalization' -count=1 -timeout=120s -v

      - name: Verify terminal archival evidence and historical readback
        run: go test ./internal/db -run '^TestRecoveryTerminal' -count=1 -timeout=120s -v

      - name: Verify prepared fence release commitments and historical readback
        run: go test ./internal/db -run '^TestRecoveryPreparedRelease' -count=1 -timeout=120s -v

      - name: Verify immutable recovery retention commitments and historical readback
        run: go test ./internal/db -run '^TestRecoveryRetention' -count=1 -timeout=120s -v
      - name: Verify immutable cleaned commit statements and historical readback
        run: go test ./internal/db -run '^TestRecoveryCleanedCommit' -count=1 -timeout=120s -v

      - name: Verify post-release evidence in PostgreSQL and immutable history
        run: go test ./internal/db -run '^TestRecoveryAdmissionRelease' -count=1 -timeout=120s -v

      - name: Verify authenticated Manager HTTP to PostgreSQL admission release
        run: go test ./internal/db -run '^TestRecoveryAdmissionReleaseHTTPPostgreSQL$' -count=1 -timeout=120s -v

      - name: Verify isolated Agent HTTP client to Manager PostgreSQL readback
        run: |
          (cd ../agent && go mod download)
          ROUTEGATE_TEST_RG140_AGENT_NETWORK=1 go test ./internal/db -run '^TestRecoveryAdmissionReleaseAgentNetwork$' -count=1 -timeout=120s -v

      - name: Verify isolated Agent submission through Manager HTTP and PostgreSQL
        run: |
          (cd ../agent && go mod download)
          ROUTEGATE_TEST_RG140_AGENT_SUBMIT=1 go test ./internal/db -run '^TestRecoveryAdmissionReleaseAgentSubmissionNetwork$' -count=1 -timeout=120s -v

      - name: Verify authenticated admission-release HTTP handlers
        run: go test ./internal/agents -run '^TestRecoveryAdmissionReleaseHandlers$' -count=1 -timeout=120s -v

      - name: Run tests
        run: go test ./...

      - name: Test isolated VLESS credential removal with real sing-box
        run: |
          test_dir="$(mktemp -d)"
          trap 'rm -rf "$test_dir"' EXIT
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/SagerNet/sing-box/releases/download/v1.12.8/sing-box-1.12.8-linux-amd64.tar.gz \
            --output "$test_dir/sing-box.tar.gz"
          printf '%s  %s\n' b41d9ae438a4367e5fd5c4aa36fe040d0c1bfe5f91f96a072eef31f61d46670c "$test_dir/sing-box.tar.gz" | sha256sum --check --status
          tar -xzf "$test_dir/sing-box.tar.gz" -C "$test_dir"
          ROUTEGATE_TEST_SING_BOX="$test_dir/sing-box-1.12.8-linux-amd64/sing-box" \
            go test ./internal/configs -run '^TestVLESSRemovalSingBox' -count=1 -timeout=60s -v

  agent-unit:
    name: Agent full suite and Reality
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: agent

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26"
          cache-dependency-path: agent/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Verify Agent typed revocation wire cannot stage as generic Apply
        run: go test ./internal/tasks -run '^TestCredentialRemovalAgentWireEnvelope$' -count=1 -timeout=120s -v

      - name: Verify post-release historical readback on Agent
        run: go test -race ./internal/client -run '^TestRecoveryAdmissionReleaseReadback' -count=1 -timeout=120s -v

      - name: Verify original-owner post-release Manager evidence submission
        run: go test -race ./internal/client -run '^TestRecoveryAdmissionReleaseOriginalOwnerSubmission$' -count=1 -timeout=120s -v

      # Every discovered tasks test must run in one shard. Keep Go's
      # original 10-minute per-process timeout: no assertion is suppressed.
      - name: Run all Agent packages except tasks
        run: |
          go list ./... | grep -v '^github.com/ikaevus/routegate/agent/internal/tasks$' |
            xargs -r go test -timeout=10m

      - name: Verify all Agent task tests are assigned to shards
        run: |
          task_tests="$(go test ./internal/tasks -list . | grep -E '^(Test|Example|Fuzz)' || true)"
          test -n "$task_tests"
          unsharded="$(printf '%s\n' "$task_tests" | grep -Ev '^(Test[A-Z]|Example|Fuzz)' || true)"
          if test -n "$unsharded"; then
            printf 'Unsharded Agent task tests:\n%s\n' "$unsharded" >&2
            exit 1
          fi

      - name: Agent tasks shard A-F plus examples/fuzz seeds
        run: go test ./internal/tasks -run '^(Test[A-F]|Example|Fuzz)' -count=1 -timeout=10m

      - name: Agent tasks shard G-M
        run: go test ./internal/tasks -run '^Test[G-M]' -count=1 -timeout=10m

      - name: Agent tasks shard N-R
        run: go test ./internal/tasks -run '^Test[N-R]' -count=1 -timeout=10m

      - name: Agent tasks shard S-Z
        run: go test ./internal/tasks -run '^Test[S-Z]' -count=1 -timeout=10m

      - name: Test scoped Agent removal with systemd and real Reality traffic
        run: |
          test_dir="$(mktemp -d)"
          trap 'rm -rf "$test_dir"' EXIT
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/SagerNet/sing-box/releases/download/v1.12.8/sing-box-1.12.8-linux-amd64.tar.gz \
            --output "$test_dir/sing-box.tar.gz"
          printf '%s  %s\n' b41d9ae438a4367e5fd5c4aa36fe040d0c1bfe5f91f96a072eef31f61d46670c "$test_dir/sing-box.tar.gz" | sha256sum --check --status
          tar -xzf "$test_dir/sing-box.tar.gz" -C "$test_dir"
          sudo env ROUTEGATE_TEST_SING_BOX="$test_dir/sing-box-1.12.8-linux-amd64/sing-box" \
            ROUTEGATE_TEST_REMOVAL_SYSTEMD=1 "$(command -v go)" test ./internal/tasks \
            -run '^TestCredentialRemovalSystemdRealityTraffic$' -count=1 -timeout=75s -v

  agent-race:
    name: Agent race (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - suite: dispatch
            packages: ./internal/config ./internal/client ./internal/heartbeat ./internal/tasks
            pattern: (FencedDispatch|RuntimeMutation|CompleteTask|CredentialRemoval)
          - suite: prepared-release
            packages: ./internal/tasks ./internal/client
            pattern: ^TestPreparedRelease
          - suite: prepared-history
            packages: ./internal/tasks ./internal/client
            pattern: ^TestPreparedSubmissionHistory
          - suite: readiness
            packages: ./internal/tasks ./internal/client
            pattern: ^TestReleaseReadiness
          - suite: retention
            packages: ./internal/tasks ./internal/client
            pattern: ^TestReleaseRetention
          - suite: retention-submission
            packages: ./internal/tasks ./internal/client
            pattern: ^TestRetentionSubmission
          - suite: independent-archive
            packages: ./internal/tasks ./internal/client
            pattern: ^TestRecoveryHistoryArchive(Independent|PublicationFailures|ReadRefusals|Authority|ClientOwner)$
          - suite: archive-crash
            packages: ./internal/tasks
            pattern: ^TestRecoveryHistoryArchiveCrash$
          - suite: source-plan
            packages: ./internal/tasks ./internal/client
            pattern: ^TestArchivedSourcePlan
          - suite: source-cleanup
            packages: ./internal/tasks ./internal/client
            pattern: ^TestArchivedSourceCleanup
          - suite: cleanup-root-crash
            packages: ./internal/tasks
            pattern: ^TestSourceCleanupCrashRoot$
          - suite: cleanup-retired-crash
            packages: ./internal/tasks
            pattern: ^TestSourceCleanupCrashRetired$
          - suite: cleaned-commit-intent
            packages: ./internal/tasks ./internal/client
            pattern: ^TestCleanedCommitIntent
          - suite: cleaned-commit-history
            packages: ./internal/tasks
            pattern: ^TestCleanedCommitIntentHistoryRefusals$
          - suite: cleaned-commit-crash
            packages: ./internal/tasks
            pattern: ^TestCleanedCommitCrash$
          - suite: cleaned-commit-submission
            packages: ./internal/tasks ./internal/client
            pattern: ^TestCleanedCommitSubmission
          - suite: cleaned-commit-proof-crash
            packages: ./internal/tasks
            pattern: ^TestCleanedCommitProofCrash$
          - suite: cleaned-commit-evidence-history
            packages: ./internal/tasks
            pattern: ^TestCleanedCommitEvidenceHistory
          - suite: cleaned-commit-plan
            packages: ./internal/tasks ./internal/client
            pattern: ^TestCleanedCommit(Plan|Readiness)
          - suite: cleaned-archive
            packages: ./internal/tasks
            pattern: ^TestCleanedArchive(Complete|Refusals|OwnedDrift)$
          - suite: cleaned-archive-client
            packages: ./internal/client
            pattern: ^TestCleanedArchiveClient$
          - suite: cleaned-archive-history
            packages: ./internal/tasks ./internal/client
            pattern: ^TestCleanedArchive(History|ClientHistory)$
          - suite: cleaned-archive-crash-before
            packages: ./internal/tasks
            pattern: ^TestCleanedArchiveCrashBeforeManifest$
          - suite: cleaned-archive-crash-after
            packages: ./internal/tasks
            pattern: ^TestCleanedArchiveCrashAfterCopies$
          - suite: cleaned-commit-ack-crash
            packages: ./internal/tasks
            pattern: ^TestCleanedCommitAckCrash$
          - suite: admission-release
            packages: ./internal/tasks
            pattern: ^TestAdmissionRelease(Complete|Scope|RefusalsBefore)$
          - suite: admission-release-drift
            packages: ./internal/tasks
            pattern: ^TestAdmissionReleaseRefusalsDuring$
          - suite: admission-release-cuts-early
            packages: ./internal/tasks
            pattern: ^TestAdmissionReleaseCutsEarly$
          - suite: admission-release-cuts-final
            packages: ./internal/tasks
            pattern: ^TestAdmissionReleaseCutsFinal$
          - suite: admission-release-client
            packages: ./internal/client
            pattern: ^TestAdmissionReleaseClientReadiness$
          - suite: admission-release-client-authority
            packages: ./internal/client
            pattern: ^TestAdmissionReleaseClientAuthority$
          - suite: admission-release-crash-early
            packages: ./internal/tasks
            pattern: ^TestAdmissionReleaseCrashEarly$
          - suite: admission-release-crash-middle
            packages: ./internal/tasks
            pattern: ^TestAdmissionReleaseCrashMiddle$
          - suite: admission-release-crash-final
            packages: ./internal/tasks
            pattern: ^TestAdmissionReleaseCrashFinal$
          - suite: admission-proof
            packages: ./internal/tasks
            pattern: ^TestAdmissionProof(Complete|Publication)$
          - suite: admission-proof-drift
            packages: ./internal/tasks
            pattern: ^TestAdmissionProofDrift$
          - suite: admission-proof-history
            packages: ./internal/tasks
            pattern: ^TestAdmissionProofHistory$
          - suite: admission-proof-client
            packages: ./internal/client
            pattern: ^TestAdmissionProofClientReadiness$
          - suite: admission-proof-client-authority
            packages: ./internal/client
            pattern: ^TestAdmissionProofClientAuthority$
          - suite: admission-proof-crash-before
            packages: ./internal/tasks
            pattern: ^TestAdmissionProofCrashBefore$
          - suite: admission-proof-crash-after
            packages: ./internal/tasks
            pattern: ^TestAdmissionProofCrashAfter$
    defaults:
      run:
        working-directory: agent
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26"
          cache-dependency-path: agent/go.sum
      - name: Download dependencies
        run: go mod download
      - name: Run unchanged focused race checks
        run: |
          if [[ '${{ matrix.suite }}' == 'cleaned-commit-intent' ]]; then
            # History runs in its own required shard with the same watchdog.
            go test -race ${{ matrix.packages }} -run '${{ matrix.pattern }}' -skip '^TestCleanedCommitIntentHistoryRefusals$' -count=1 -timeout=120s -v
          else
            go test -race ${{ matrix.packages }} -run '${{ matrix.pattern }}' -count=1 -timeout=120s -v
          fi

  agent:
    name: Agent tests
    needs: [agent-unit, agent-race]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every Agent suite
        run: |
          test "${{ needs.agent-unit.result }}" = success
          test "${{ needs.agent-race.result }}" = success

  installer:
    name: Clean VPS installer checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26"
          cache-dependency-path: |
            backend/go.sum
            agent/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install ShellCheck
        run: |
          # GitHub's Ubuntu image includes a Chrome apt source that is unrelated
          # to RouteGate and can transiently publish mismatched indexes. The
          # installer job does not use Chrome, so exclude only that source
          # before refreshing the Ubuntu package indexes used for ShellCheck.
          for source in /etc/apt/sources.list.d/*; do
            if [[ -f "$source" ]] && grep -q 'dl.google.com/linux/chrome' "$source"; then
              sudo rm -f "$source"
            fi
          done
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Verify attestation CLI capability
        run: |
          command -v gh >/dev/null
          gh attestation verify --help | grep -Fq -- '--predicate-type'

      - name: Validate shell syntax
        run: |
          bash -n \
            install.sh \
            install-agent.sh \
            install-grafana.sh \
            scripts/build-release-bundle.sh \
            scripts/deploy-production-like-bundle.sh \
            scripts/production-like-ops.sh \
            scripts/production-like-preflight-applied-client-settings.sh \
            scripts/production-like-update-manager.sh \
            scripts/routegate-recovery \
            scripts/routegate-update-bootstrap.sh \
            scripts/routegate-update-core.sh \
            scripts/routegate-update-role.sh \
            scripts/routegate-update-transaction.sh \
            scripts/routegate-update-verified.sh \
            scripts/test-agent-installer.sh \
            scripts/test-attestation-verifier-runtime.sh \
            scripts/test-clean-vps-installer.sh \
            scripts/test-manager-migration-ownership.sh \
            scripts/test-grafana-installer.sh \
            scripts/test-production-like-preflight.sh \
            scripts/test-production-like-update-manager.sh \
            scripts/test-recovery-tool.sh \
            scripts/test-update-bootstrap.sh \
            scripts/test-update-core.sh \
            scripts/test-update-role.sh \
            scripts/test-update-toolchain.sh \
            scripts/test-update-verified.sh \
            scripts/validate-production-like-deploy.sh

      - name: Run ShellCheck
        run: |
          shellcheck -x \
            install.sh \
            install-agent.sh \
            install-grafana.sh \
            scripts/build-release-bundle.sh \
            scripts/deploy-production-like-bundle.sh \
            scripts/production-like-ops.sh \
            scripts/production-like-preflight-applied-client-settings.sh \
            scripts/production-like-update-manager.sh \
            scripts/routegate-recovery \
            scripts/routegate-update-bootstrap.sh \
            scripts/routegate-update-core.sh \
            scripts/routegate-update-role.sh \
            scripts/routegate-update-transaction.sh \
            scripts/routegate-update-verified.sh \
            scripts/test-attestation-verifier-runtime.sh \
            scripts/test-grafana-installer.sh \
            scripts/test-production-like-preflight.sh \
            scripts/test-production-like-update-manager.sh \
            scripts/test-recovery-tool.sh \
            scripts/test-update-bootstrap.sh \
            scripts/test-update-core.sh \
            scripts/test-update-role.sh \
            scripts/test-update-toolchain.sh \
            scripts/test-update-verified.sh \
            scripts/validate-production-like-deploy.sh
          # These contract tests intentionally grep literal shell source containing "$helper".
          shellcheck -x -e SC2016 \
            scripts/test-manager-migration-ownership.sh \
            scripts/test-agent-installer.sh \
            scripts/test-clean-vps-installer.sh

      - name: Run installer and host-operation unit tests
        run: |
          sudo bash scripts/test-manager-migration-ownership.sh
          bash scripts/test-agent-installer.sh
          scripts/test-clean-vps-installer.sh
          bash scripts/test-grafana-installer.sh
          sudo bash scripts/test-production-like-preflight.sh
          sudo bash scripts/test-production-like-update-manager.sh
          bash scripts/test-recovery-tool.sh
          sudo bash scripts/test-attestation-verifier-runtime.sh
          bash scripts/test-update-bootstrap.sh
          bash scripts/test-update-core.sh
          sudo bash scripts/test-update-role.sh
          sudo python3 -m unittest scripts/test_restore_mode_record.py scripts/test_pin_writer.py scripts/test_pin_publication_rollback.py scripts/test_host_lock.py scripts/test_rg140_repair_us_agent.py
          bash scripts/test-update-toolchain.sh
          bash scripts/test-update-verified.sh
          python3 -m unittest scripts/test_outer_rollback_stop.py scripts/test_maintenance_dispatch.py scripts/test_publish_bootstrap.py scripts/test_remote_node_vpn_e2e.py
          bash scripts/routegate-update-transaction.sh --help >/dev/null
          bash scripts/routegate-update-verified.sh --help >/dev/null

      - name: Run release manifest tests
        run: python3 -m unittest scripts/test_release_manifest.py

      - name: Test UI publication recovery
        run: python3 -m unittest scripts/test_rg140_session_ui.py
      - name: Test schema159 Manager publication and recovery
        run: |
          sudo bash scripts/test-rg140-manager-main.sh
          sudo bash scripts/test-rg140-manager-main.sh 567a1e154254eebb7f8ee95e46a97c5d0b3c8e4a

      - name: Test pinned RG140 release workflow safety
        run: bash scripts/test-rg140-preview-release-workflow.sh

      - name: Build and verify amd64 release bundle
        env:
          VERSION: ci-test
          COMMIT: ${{ github.sha }}
          ARCHITECTURES: amd64
          OUTPUT_DIR: ${{ runner.temp }}/routegate-dist
        run: |
          scripts/build-release-bundle.sh
          python3 scripts/release_manifest.py verify \
            --manifest "$OUTPUT_DIR/release-manifest.json" \
            --artifacts-dir "$OUTPUT_DIR"
          cd "$OUTPUT_DIR"
          sha256sum -c SHA256SUMS
          sha256sum -c INSTALLER_SHA256SUMS
          test -s install.sh
          test -s install-agent.sh
          test -s install-grafana.sh
          tar -tzf routegate-ci-test-linux-amd64.tar.gz > bundle-files.txt
          grep -Fxq './bin/routegate-manager' bundle-files.txt
          grep -Fxq './bin/routegate-agent' bundle-files.txt
          grep -Fxq './frontend/index.html' bundle-files.txt
          grep -Fq './manager/migrations/' bundle-files.txt
          grep -Fxq './tools/routegate-recovery' bundle-files.txt
          grep -Fxq './tools/release_manifest.py' bundle-files.txt
          grep -Fxq './tools/routegate-update-bootstrap.sh' bundle-files.txt
          grep -Fxq './tools/routegate-update-core.sh' bundle-files.txt
          grep -Fxq './tools/routegate-update-role.sh' bundle-files.txt
          grep -Fxq './tools/routegate-update-transaction.sh' bundle-files.txt
          grep -Fxq './tools/routegate-update-verified.sh' bundle-files.txt
          grep -Fxq './tools/routegate-maintenance-dispatch.py' bundle-files.txt
          grep -Fxq './systemd/routegate-maintenance-dispatch.socket' bundle-files.txt
          grep -Fxq './systemd/routegate-maintenance-dispatch@.service' bundle-files.txt
          grep -Fxq './metadata/manifest.env' bundle-files.txt
          test -s release-manifest.json

      - name: Upload amd64 clean-host E2E bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: routegate-${{ github.event.pull_request.head.sha || github.sha }}-linux-amd64
          path: |
            ${{ runner.temp }}/routegate-dist/routegate-ci-test-linux-amd64.tar.gz
            ${{ runner.temp }}/routegate-dist/SHA256SUMS
            ${{ runner.temp }}/routegate-dist/INSTALLER_SHA256SUMS
            ${{ runner.temp }}/routegate-dist/install.sh
            ${{ runner.temp }}/routegate-dist/install-agent.sh
            ${{ runner.temp }}/routegate-dist/install-grafana.sh
            ${{ runner.temp }}/routegate-dist/release-manifest.json
          if-no-files-found: error
          retention-days: 7

  remote-node-bootstrap:
    name: Manager command to Reality traffic
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: routegate_remote_bootstrap_e2e
          POSTGRES_USER: routegate
          POSTGRES_PASSWORD: routegate_e2e_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U routegate -d routegate_remote_bootstrap_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ROUTEGATE_E2E_ISOLATED: '1'
      ROUTEGATE_E2E_DATABASE_URL: postgres://routegate:routegate_e2e_password@127.0.0.1:5432/routegate_remote_bootstrap_e2e?sslmode=disable
      ROUTEGATE_E2E_PUBLIC_URL: https://localhost:18443
      ROUTEGATE_E2E_MANAGER_ADDR: 127.0.0.1:18080
      ROUTEGATE_E2E_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact commit under test
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.ROUTEGATE_E2E_COMMIT }}
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26'
          cache-dependency-path: |
            backend/go.sum
            agent/go.sum

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Exercise real generated bootstrap
        run: |
          chmod +x scripts/remote-node-bootstrap-e2e.sh
          scripts/remote-node-bootstrap-e2e.sh

      # The Manager command and local Agent config contain credentials. Keep
      # failure diagnostics on the ephemeral runner rather than uploading logs.
      - name: Show installer stage on failure
        if: failure()
        run: |
          if sudo test -f /var/lib/routegate-agent-installer/state.env; then
            sudo sed -n '/^STATUS=/p; /^STAGE=/p' /var/lib/routegate-agent-installer/state.env
          fi

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check localization
        run: npm run i18n:check

      - name: Test rollout UI safety model
        run: npm run test:rollout

      - name: Test shared UI semantics
        run: npm run test:ui

      - name: Test Getting Started node state model
        run: npm run test:getting-started

      - name: Test account subscription readiness model
        run: node --test src/pages/vpn-accounts/accountAccessReadiness.test.ts

      - name: Test device subscription request evidence
        run: node --test src/pages/vpn-accounts/subscriptionRequestEvidence.test.ts

      - name: Test account revocation UX safety
        run: node --test src/pages/vpn-accounts/accountRevocationSafety.test.ts

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Test Getting Started in the browser
        run: npm run test:getting-started-browser

      - name: Test VPN node onboarding in the browser
        run: npm run test:node-onboarding-browser

      - name: Test protocol selection drafts in the browser
        run: npm run test:protocol-drafts-browser

      - name: Test guided account transfer in the browser
        run: npm run test:account-transfer-browser

      - name: Test subscription request evidence in the browser
        run: node --test scripts/subscription-request.browser.test.mjs

      - name: Test admin session recovery in the browser
        run: npm run test:admin-session-browser

      - name: Build frontend
        run: npm run build

  website:
    name: Website build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: website

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

name: RouteGate Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version label used in generated bundle names
        required: true
        default: dev

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  source-policy:
    name: Enforce tagged source and Hybrid CI policy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Require included native Hybrid acceptance test
        run: |
          # Fail CLOSED when a release tag references a commit that predates
          # the tested Clean VPS/Hybrid pipeline. The reusable CI must contain
          # the exact disposable native smoke job, not just source-unit tests.
          test -s scripts/hybrid-disposable-installer-e2e.sh
          test -s scripts/hybrid-vpn-e2e.py
          grep -Eq '^  hybrid-native-e2e:' .github/workflows/ci.yml
          grep -Fq 'bash scripts/hybrid-disposable-installer-e2e.sh' .github/workflows/ci.yml
          grep -Fq 'python3 "$ROOT/scripts/hybrid-vpn-e2e.py"' scripts/hybrid-disposable-installer-e2e.sh

      - name: Reject tags not in canonical main history
        if: github.event_name == 'push'
        env:
          REF_NAME: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]] || {
            echo "::error::Release tags must be semantic vX.Y.Z or vX.Y.Z-rc.N."
            exit 1
          }
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main || {
            echo "::error::Refusing to build a release tag outside reviewed main history."
            exit 1
          }

  ci:
    name: Same-commit RouteGate CI including native Hybrid E2E
    needs: source-policy
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  bundles:
    name: Build native release bundles
    needs: ci
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26"
          cache-dependency-path: |
            backend/go.sum
            agent/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Resolve bundle version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.ref_name }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            version="$TAG_NAME"
          else
            version="$MANUAL_VERSION"
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Build bundles
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: scripts/build-release-bundle.sh

      - name: Verify release manifest, checksums and bundle structure
        run: |
          python3 scripts/release_manifest.py verify \
            --manifest dist/release-manifest.json \
            --artifacts-dir dist
          cd dist
          sha256sum -c SHA256SUMS
          sha256sum -c INSTALLER_SHA256SUMS
          bash -n install.sh install-agent.sh install-grafana.sh
          for bundle in routegate-*.tar.gz; do
            listing="${bundle}.files"
            tar -tzf "$bundle" > "$listing"
            grep -Fxq './bin/routegate-manager' "$listing"
            grep -Fxq './bin/routegate-agent' "$listing"
            grep -Fxq './frontend/index.html' "$listing"
            # Check what will actually SHIP, not the working tree or
            # standalone frontend build. A stale theme must block drafts.
            index_html=$(tar -xOzf "$bundle" ./frontend/index.html)
            if [[ "$index_html" != *'data-theme="dark"'* || "$index_html" != *'color-scheme: dark'* ]]; then
              echo "::error::Release bundle $bundle has a stale frontend (dark-only UI contract missing)."
              exit 1
            fi
            grep -Fq './manager/migrations/' "$listing"
            grep -Fxq './tools/release_manifest.py' "$listing"
            grep -Fxq './tools/routegate-update-bootstrap.sh' "$listing"
            grep -Fxq './tools/routegate-update-core.sh' "$listing"
            grep -Fxq './tools/routegate-update-role.sh' "$listing"
            grep -Fxq './tools/routegate-update-transaction.sh' "$listing"
            grep -Fxq './tools/routegate-update-verified.sh' "$listing"
            grep -Fxq './tools/routegate-maintenance-dispatch.py' "$listing"
            grep -Fxq './systemd/routegate-maintenance-dispatch.socket' "$listing"
            grep -Fxq './systemd/routegate-maintenance-dispatch@.service' "$listing"
            grep -Fxq './metadata/manifest.env' "$listing"
          done
          test -s release-manifest.json

      - name: Attest release manifest provenance
        id: attest_manifest
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: dist/release-manifest.json

      - name: Attest release bundle provenance
        id: attest_bundles
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: dist/routegate-*.tar.gz

      - name: Attest installer script provenance
        id: attest_installers
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: dist/install*.sh

      - name: Preserve offline attestation bundles
        env:
          MANIFEST_ATTESTATION: ${{ steps.attest_manifest.outputs.bundle-path }}
          BUNDLE_ATTESTATION: ${{ steps.attest_bundles.outputs.bundle-path }}
          INSTALLER_ATTESTATION: ${{ steps.attest_installers.outputs.bundle-path }}
        run: |
          test -s "$MANIFEST_ATTESTATION"
          test -s "$BUNDLE_ATTESTATION"
          test -s "$INSTALLER_ATTESTATION"
          cp "$MANIFEST_ATTESTATION" dist/release-manifest.attestation.json
          cp "$BUNDLE_ATTESTATION" dist/release-bundles.attestation.json
          cp "$INSTALLER_ATTESTATION" dist/installer-scripts.attestation.json

      - name: Verify release provenance policy
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/release.yml
          PREDICATE_TYPE: https://slsa.dev/provenance/v1
        run: |
          gh attestation verify dist/release-manifest.json \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$SIGNER_WORKFLOW" \
            --predicate-type "$PREDICATE_TYPE" \
            --bundle dist/release-manifest.attestation.json

          for bundle in dist/routegate-*.tar.gz; do
            gh attestation verify "$bundle" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$SIGNER_WORKFLOW" \
              --predicate-type "$PREDICATE_TYPE" \
              --bundle dist/release-bundles.attestation.json
          done

          for installer in dist/install.sh dist/install-agent.sh dist/install-grafana.sh; do
            gh attestation verify "$installer" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$SIGNER_WORKFLOW" \
              --predicate-type "$PREDICATE_TYPE" \
              --bundle dist/installer-scripts.attestation.json
          done

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: routegate-${{ steps.version.outputs.version }}-bundles
          path: |
            dist/routegate-*.tar.gz
            dist/SHA256SUMS
            dist/INSTALLER_SHA256SUMS
            dist/install.sh
            dist/install-agent.sh
            dist/install-grafana.sh
            dist/release-manifest.json
            dist/release-manifest.attestation.json
            dist/release-bundles.attestation.json
            dist/installer-scripts.attestation.json
          if-no-files-found: error

      - name: Publish GitHub release assets
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # A release candidate must not become the default /releases/latest
          # target consumed by the public Clean VPS installer.
          release_flags=()
          if [[ "$TAG_NAME" == *-rc.* ]]; then
            release_flags+=(--prerelease)
          fi
          # Tag builds create candidates only; public release requires
          # verified Hybrid E2E and explicit RG-140 review.
          # See docs/release/promotion-gate.md before manually publishing.
          # Never overwrite assets already associated with a version/tag.
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "::error::Release $TAG_NAME already exists. Refusing to replace assets; choose a new version/tag."
            exit 1
          fi
          notes_file="docs/release/${TAG_NAME}.md"
          if [[ -f "$notes_file" ]]; then
            gh release create "$TAG_NAME" \
              dist/routegate-*.tar.gz \
              dist/SHA256SUMS \
              dist/INSTALLER_SHA256SUMS \
              dist/install.sh \
              dist/install-agent.sh \
              dist/install-grafana.sh \
              dist/release-manifest.json \
              dist/release-manifest.attestation.json \
              dist/release-bundles.attestation.json \
              dist/installer-scripts.attestation.json \
              --verify-tag \
              --notes-file "$notes_file" \
              --draft \
              "${release_flags[@]}" \
              --title "RouteGate $TAG_NAME"
          else
            gh release create "$TAG_NAME" \
              dist/routegate-*.tar.gz \
              dist/SHA256SUMS \
              dist/INSTALLER_SHA256SUMS \
              dist/install.sh \
              dist/install-agent.sh \
              dist/install-grafana.sh \
              dist/release-manifest.json \
              dist/release-manifest.attestation.json \
              dist/release-bundles.attestation.json \
              dist/installer-scripts.attestation.json \
              --verify-tag \
              --generate-notes \
              --draft \
              "${release_flags[@]}" \
              --title "RouteGate $TAG_NAME"
          fi

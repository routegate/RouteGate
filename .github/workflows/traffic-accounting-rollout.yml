name: Traffic accounting scoped US rollout
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only US accounting evidence; install/apply remain disabled
        type: choice
        required: true
        default: inspect
        options: [inspect]
permissions:
  contents: read
  actions: read
concurrency:
  group: routegate-production-like-deploy
  cancel-in-progress: false
jobs:
  traffic:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production-like
    timeout-minutes: 20
    env:
      CANDIDATE: 58485650c42a394ae1305fdff1a7896e2f3c1b93
      MODE: ${{ inputs.mode }}
    steps:
      - name: Checkout trusted rollout helper
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: main
          fetch-depth: 0
      - name: Verify candidate and exact successful CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$MODE" == inspect ]]
          git merge-base --is-ancestor "$CANDIDATE" HEAD
          for run in 41137852704 41137852705; do
            result=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq '.head_sha + "|" + .status + "|" + .conclusion')
            [[ "$result" == "$CANDIDATE|completed|success" ]]
          done
          python3 -m unittest scripts/test_traffic_accounting_rollout.py
      - name: Configure existing SSH identity
        env:
          ROUTEGATE_SSH_KEY: ${{ secrets.ROUTEGATE_SSH_KEY }}
          ROUTEGATE_KNOWN_HOSTS: ${{ vars.ROUTEGATE_KNOWN_HOSTS || secrets.ROUTEGATE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$ROUTEGATE_SSH_KEY"
          test -n "$ROUTEGATE_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ROUTEGATE_SSH_KEY" > ~/.ssh/routegate_ci
          printf '%s\n' "$ROUTEGATE_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/routegate_ci ~/.ssh/known_hosts
      - name: Run scoped US operation
        env:
          ROUTEGATE_HOST: ${{ vars.ROUTEGATE_HOST || secrets.ROUTEGATE_HOST }}
          ROUTEGATE_USER: ${{ vars.ROUTEGATE_USER || secrets.ROUTEGATE_USER }}
        run: |
          set -euo pipefail
          SSH=(ssh -i ~/.ssh/routegate_ci -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10)
          SCP=(scp -i ~/.ssh/routegate_ci -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10)
          remote=$("${SSH[@]}" "$ROUTEGATE_USER@$ROUTEGATE_HOST" "umask 077; mktemp -d '/tmp/routegate-traffic-${GITHUB_RUN_ID}.XXXXXX'")
          [[ "$remote" =~ ^/tmp/routegate-traffic-[0-9]+\.[A-Za-z0-9]+$ ]]
          cleanup() { "${SSH[@]}" "$ROUTEGATE_USER@$ROUTEGATE_HOST" "rm -rf -- '$remote'" || true; }
          trap cleanup EXIT
          "${SCP[@]}" scripts/traffic-accounting-rollout.py "$ROUTEGATE_USER@$ROUTEGATE_HOST:$remote/runner.py"
          "${SSH[@]}" "$ROUTEGATE_USER@$ROUTEGATE_HOST" "sudo -n flock -w 60 /run/lock/routegate-production-like.lock bash -s -- '$remote' '$MODE' '$GITHUB_RUN_ID'" <<'REMOTE'
          set -euo pipefail
          set +x
          set -a
          source /etc/routegate/manager.env >/dev/null 2>&1
          set +a
          exec python3 "$1/runner.py" "$2" "$1" "$3"
          REMOTE
      - name: Remove runner credentials
        if: always()
        run: rm -f ~/.ssh/routegate_ci ~/.ssh/known_hosts
